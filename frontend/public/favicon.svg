<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer glowing ring (mimicking LED glow) -->
  <circle cx="50" cy="50" r="45" fill="#3FA9A0" opacity="0.2" />
  <!-- Inner ring/circle -->
  <circle cx="50" cy="50" r="30" fill="#3FA9A0" />
  <!-- A central cutout or detail to make it look like a physical LED or port -->
  <circle cx="50" cy="50" r="10" fill="#1B212B" />
</svg>