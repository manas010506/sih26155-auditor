! HPE Aruba AOS-CX — probe config for the training loop.
! Deliberately a vendor with no parser: every meaningful line here should
! land in _unparsed and receive a suggestion from suggest.py.
!
hostname ARUBA-CORE-01
!
banner motd "Authorised access only. Activity is monitored."
!
ntp server 10.10.0.10 iburst
ntp enable
!
logging 10.10.0.200
logging facility local7
!
snmp-server community public
snmp-server host 10.10.0.50 trap version 2c public
!
ssh server vrf mgmt
ssh maximum-auth-attempts 3
!
user admin group administrators password plaintext admin123
!
aaa authentication login default local
aaa accounting all-mgmt default start-stop group tacacs
!
vlan 1
    no shutdown
!
interface mgmt
    no shutdown
    ip static 10.10.0.5/24
!
https-server vrf mgmt
telnet-server
!
cli-session timeout 0
!