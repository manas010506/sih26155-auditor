! Positive fixture: CHAIN-NET-SNMP-CONTROL
! Expect CIS-NET-008, CIS-NET-009, CIS-NET-011 to fire.
! CIS-NET-001, 004, 006 satisfied so CHAIN-NET-MGMT-TAKEOVER cannot reach 4.
version 15.2
hostname CHAIN-SNMP-POS
!
service password-encryption
!
enable secret 5 $1$abcd$efghijklmnopqrst
!
username admin privilege 15 secret 5 $1$abcd$efghijklmnopqrst
!
snmp-server community public RO
snmp-server community private RW
!
ip access-list standard MGMT-ACL
 permit 10.0.0.0 0.0.0.255
!
line vty 0 4
 access-class MGMT-ACL in
 transport input ssh
 exec-timeout 5 0
!
end
