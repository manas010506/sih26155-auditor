/system identity set name=EDGE-MT-01
/ip service set telnet disabled=no
/ip service set ssh port=22
/snmp set enabled=yes contact=netops location=DC1
/snmp community set [ find default=yes ] name=public
/user set admin password=admin123
/system logging action set 0 remote=0.0.0.0
/ip firewall filter add chain=input action=accept
/system clock set time-zone-name=Asia/Kolkata
/interface ethernet set [ find default-name=ether1 ] name=WAN
