- id: CIS-CLOUD-001
  title: Security group exposes an administrative port to the internet
  applies_to: security_group_rule
  when:
    open_to_internet: true
  cis_control: CIS AWS 1.5.0 5.2 - No security group ingress from 0.0.0.0/0 to remote administration ports
  severity: critical
  check:
    attribute: from_port
    operator: not_in
    value:
    - 22
    - 3389
  remediation: "ingress {\n  from_port   = 22\n  to_port     = 22\n  protocol    =\
    \ \"tcp\"\n  cidr_blocks = [\"10.0.0.0/8\"]\n}"
  explanation: SSH is reachable from every address on the internet. This is the most
    scanned port on AWS and the usual first step in a host compromise.
- id: CIS-CLOUD-002
  title: Security group exposes RDP to the internet
  applies_to: security_group_rule
  when:
    open_to_internet: true
    from_port: 3389
  cis_control: CIS AWS 1.5.0 5.2 - No security group ingress from 0.0.0.0/0 to remote administration ports
  severity: high
  check:
    attribute: cidr_blocks
    operator: not_contains
    value: 0.0.0.0/0
  remediation: cidr_blocks = ["10.0.0.0/8"]
  explanation: RDP open to the world is continuously scanned and brute-forced, and
    exposes the service to protocol-level vulnerabilities regardless of password strength.
- id: CIS-CLOUD-003
  title: Security group exposes all TCP ports to the internet
  applies_to: security_group_rule
  when:
    open_to_internet: true
  cis_control: CIS AWS 1.5.0 5.2 - No security group ingress from 0.0.0.0/0 to remote administration ports
  severity: critical
  check:
    attribute: is_wide_range
    operator: equals
    value: false
  remediation: '# Remove the 0-65535 ingress block entirely.

    # Open only the ports the service actually needs.'
  explanation: A rule opening ports 0-65535 to 0.0.0.0/0 makes every other ingress
    restriction on the group meaningless.
- id: CIS-CLOUD-004
  title: S3 bucket has a public ACL
  applies_to: s3_bucket
  cis_control: CIS AWS 1.5.0 2.1.5 - Configure S3 Block Public Access (bucket settings)
  severity: critical
  check:
    attribute: acl
    operator: not_in
    value:
    - public-read
    - public-read-write
    - authenticated-read
  remediation: "resource \"aws_s3_bucket_acl\" \"sensitive_data\" {\n  bucket = aws_s3_bucket.sensitive_data.id\n\
    \  acl    = \"private\"\n}"
  explanation: A public-read ACL exposes every object in the bucket to anonymous requests.
- id: CIS-CLOUD-005
  title: S3 bucket has no public access block
  applies_to: s3_bucket
  cis_control: CIS AWS 1.5.0 2.1.5 - Configure S3 Block Public Access (bucket settings)
  severity: high
  check:
    attribute: public_access_block
    operator: equals
    value: true
  remediation: "resource \"aws_s3_bucket_public_access_block\" \"sensitive_data\"\
    \ {\n  bucket                  = aws_s3_bucket.sensitive_data.id\n  block_public_acls\
    \       = true\n  block_public_policy     = true\n  ignore_public_acls      =\
    \ true\n  restrict_public_buckets = true\n}"
  explanation: Nothing prevents a future ACL or bucket policy from making this bucket
    public again. The block is the control that survives human error.
- id: CIS-CLOUD-006
  title: S3 bucket has no server-side encryption
  applies_to: s3_bucket
  cis_control: CIS AWS 1.5.0 2.1.1 - Ensure all S3 buckets employ encryption-at-rest
  severity: high
  check:
    attribute: encrypted
    operator: equals
    value: true
  remediation: "resource \"aws_s3_bucket_server_side_encryption_configuration\" \"\
    sensitive_data\" {\n  bucket = aws_s3_bucket.sensitive_data.id\n  rule {\n   \
    \ apply_server_side_encryption_by_default {\n      sse_algorithm     = \"aws:kms\"\
    \n      kms_master_key_id = aws_kms_key.app_key.arn\n    }\n  }\n}"
  explanation: Objects are stored unencrypted while another bucket in the same file
    is encrypted, which is drift rather than a deliberate choice.
- id: CIS-CLOUD-007
  title: S3 bucket versioning disabled
  applies_to: s3_bucket
  cis_control: 'Not in CIS AWS Foundations 1.5.0 - AWS hardening: enable S3 bucket versioning'
  severity: medium
  check:
    attribute: versioning
    operator: equals
    value: true
  remediation: "resource \"aws_s3_bucket_versioning\" \"sensitive_data\" {\n  bucket\
    \ = aws_s3_bucket.sensitive_data.id\n  versioning_configuration {\n    status\
    \ = \"Enabled\"\n  }\n}"
  explanation: Without versioning an overwrite or deletion is unrecoverable, whether
    accidental or from ransomware.
- id: CIS-CLOUD-008
  title: S3 access logging disabled
  applies_to: s3_bucket
  cis_control: 'Not in CIS AWS Foundations 1.5.0 - AWS hardening: enable S3 server access logging'
  severity: medium
  check:
    attribute: access_logging
    operator: equals
    value: true
  remediation: "resource \"aws_s3_bucket_logging\" \"sensitive_data\" {\n  bucket\
    \        = aws_s3_bucket.sensitive_data.id\n  target_bucket = aws_s3_bucket.app_logs.id\n\
    \  target_prefix = \"s3-access/\"\n}"
  explanation: No record exists of who read objects from this bucket, so an exploited
    public ACL leaves no trail.
- id: CIS-CLOUD-009
  title: IAM policy grants wildcard action on wildcard resource
  applies_to: iam_policy
  when:
    wildcard_resource: true
  cis_control: CIS AWS 1.5.0 1.16 - No IAM policies granting full *:* administrative privileges
  severity: critical
  check:
    attribute: wildcard_action
    operator: equals
    value: false
  remediation: "Statement = [{\n  Effect   = \"Allow\"\n  Action   = [\"s3:GetObject\"\
    , \"s3:PutObject\"]\n  Resource = [\"arn:aws:s3:::corp-app-logs-prod/*\"]\n}]"
  explanation: Action "*" on Resource "*" is administrator access, so a single compromised
    workload becomes full account control.
- id: CIS-CLOUD-010
  title: CloudTrail is not multi-region
  applies_to: cloudtrail
  cis_control: CIS AWS 1.5.0 3.1 - Ensure CloudTrail is enabled in all regions
  severity: high
  check:
    attribute: multi_region
    operator: equals
    value: true
  remediation: is_multi_region_trail = true
  explanation: Activity outside the trail's region is unrecorded, and attackers routinely
    operate in unused regions for exactly that reason.
- id: CIS-CLOUD-015
  title: CloudTrail log file validation disabled
  applies_to: cloudtrail
  cis_control: CIS AWS 1.5.0 3.2 - Ensure CloudTrail log file validation is enabled
  severity: low
  check:
    attribute: log_file_validation
    operator: equals
    value: true
  remediation: enable_log_file_validation = true
  explanation: Without validation there is no way to prove log files were not altered
    after delivery, which undermines their value as evidence.
- id: CIS-CLOUD-011
  title: RDS instance is publicly accessible
  applies_to: rds_instance
  cis_control: CIS AWS 1.5.0 2.3.3 - Ensure public access is not given to RDS instances
  severity: critical
  check:
    attribute: publicly_accessible
    operator: equals
    value: false
  remediation: publicly_accessible = false
  explanation: The production database has a public endpoint, so its only protection
    is the security group in front of it.
- id: CIS-CLOUD-012
  title: RDS storage is not encrypted
  applies_to: rds_instance
  cis_control: CIS AWS 1.5.0 2.3.1 - Ensure encryption is enabled for RDS instances
  severity: high
  check:
    attribute: storage_encrypted
    operator: equals
    value: true
  remediation: 'storage_encrypted = true

    kms_key_id        = aws_kms_key.app_key.arn'
  explanation: "Volumes and automated snapshots are unencrypted, and this cannot be\
    \ fixed in place \u2014 it needs a snapshot, an encrypted copy and a restore."
- id: CIS-CLOUD-014
  title: RDS backup retention below policy minimum
  applies_to: rds_instance
  cis_control: 'Not in CIS AWS Foundations 1.5.0 - AWS hardening: keep RDS backup retention at 7 days or more'
  severity: low
  check:
    attribute: backup_retention_days
    operator: gte
    value: 7
  remediation: backup_retention_period = 7
  explanation: A single day of automated backups means a problem found on Monday morning
    may already be unrecoverable.
- id: CIS-CLOUD-013
  title: KMS key rotation disabled
  applies_to: kms_key
  cis_control: CIS AWS 1.5.0 3.8 - Ensure rotation for customer-created KMS keys is enabled
  severity: medium
  check:
    attribute: key_rotation
    operator: equals
    value: true
  remediation: enable_key_rotation = true
  explanation: Key material never changes, so a key compromised at any point stays
    useful indefinitely. Rotation is automatic and needs no application change.
- id: CIS-CLOUD-016
  title: CloudTrail is not configured
  applies_to: cloudtrail
  cis_control: CIS AWS 1.5.0 3.1 - Ensure CloudTrail is enabled in all regions
  severity: high
  check:
    attribute: exists
    operator: equals
    value: true
  remediation: resource "aws_cloudtrail" "main" { ... }
  explanation: With no trail there is no record of API activity in the account at
    all.
- id: CIS-CLOUD-017
  title: RDS deletion protection disabled
  applies_to: rds_instance
  cis_control: 'Not in CIS AWS Foundations 1.5.0 - AWS hardening: enable RDS deletion protection'
  severity: medium
  check:
    attribute: deletion_protection
    operator: equals
    value: true
  remediation: deletion_protection = true
  explanation: Without deletion protection a single misapplied plan can destroy the
    production database.
- id: CIS-CLOUD-018
  title: RDS automatic minor version upgrades disabled
  applies_to: rds_instance
  cis_control: CIS AWS 1.5.0 2.3.2 - Ensure Auto Minor Version Upgrade is enabled for RDS instances
  severity: medium
  check:
    attribute: auto_minor_version_upgrade
    operator: equals
    value: true
  remediation: auto_minor_version_upgrade = true
  explanation: Engine security patches are not applied automatically, so known vulnerabilities
    persist until someone schedules a manual upgrade.
