- id: NIST-AC-02
  title: 'Account Management: Least Privilege'
  applies_to: local_user
  severity: medium
  cis_control: N/A
  check:
    attribute: privilege
    operator: lte
    value: 1
  remediation: Assign the user to a non-privileged account (privilege 1) unless administrative
    access is required.
  explanation: Ensures that users are granted the minimum level of privilege necessary
    to perform their job functions.
  framework: NIST
- id: NIST-AC-03
  title: 'Access Enforcement: Restricted Management Access'
  applies_to: vty_line
  severity: high
  cis_control: N/A
  check:
    attribute: access_class
    operator: exists
    value: true
  remediation: Apply an access-class to all VTY lines to restrict management access
    to trusted IP addresses.
  explanation: Restricting access to the management plane prevents unauthorized users
    from attempting to log into the device.
  framework: NIST
- id: NIST-SC-08
  title: 'Transmission Confidentiality: SSHv2 Enforced'
  applies_to: ssh_settings
  severity: high
  cis_control: N/A
  check:
    attribute: ssh_version
    operator: equals
    value: 2
  remediation: 'Run the command: ip ssh version 2'
  explanation: Ensures that administrative traffic is encrypted using a secure version
    of the SSH protocol.
  framework: NIST
