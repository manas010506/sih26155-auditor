- id: AWS-LOG-003
  title: Ensure AWS Config is enabled
  applies_to: aws_config
  cis_control: CIS AWS Foundations 3.5.1
  severity: high
  check:
    attribute: is_enabled
    operator: equals
    value: true
  remediation: Enable AWS Config to start recording resource configuration changes.
  explanation: AWS Config provides a historical record of resource configurations,
    allowing the team to identify when a security drift occurred.
