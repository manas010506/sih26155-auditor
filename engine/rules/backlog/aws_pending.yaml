- id: AWS-LOG-003
  title: Ensure AWS Config is enabled
  applies_to: aws_config
  cis_control: CIS AWS Foundations 3.5.1
  severity: high
  check:
    attribute: is_enabled
    operator: equals
    value: true
  remediation: Enable AWS Config to start recording resource configuration changes.
  explanation: AWS Config provides a historical record of resource configurations,
    allowing the team to identify when a security drift occurred.
- id: AWS-S3-001
  title: Ensure S3 Bucket Policy is set to deny HTTP requests
  applies_to: s3_bucket
  cis_control: CIS AWS Foundations 3.1.1
  severity: high
  check:
    attribute: deny_http_requests
    operator: equals
    value: true
  remediation: Add a bucket policy statement that denies any request where 'aws:SecureTransport'
    is false.
  explanation: Allowing HTTP requests exposes data in transit to interception and
    man-in-the-middle attacks.
