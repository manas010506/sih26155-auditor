!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname EDGE-RTR-01
!
enable secret 9 $9$PLACEHOLDERHASHvalue0
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
!
username admin privilege 15 password 0 admin123
!
no cdp run
!
no ip http server
ip http secure-server
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
banner login ^C
Authorised access only. Activity is monitored.
^C
!
interface GigabitEthernet0/0
 description WAN uplink to ISP
 ip address 203.0.113.10 255.255.255.248
!
interface GigabitEthernet0/1
 description Core LAN
 ip address 10.10.0.1 255.255.255.0
!
ip access-list standard MGMT-HOSTS
 permit 10.10.0.0 0.0.0.255
!
snmp-server group SECURE v3 priv
snmp-server community public RO
snmp-server host 10.10.0.200 version 3 priv netmon
!
logging host 10.10.0.200
logging trap informational
!
line con 0
 exec-timeout 10 0
 login authentication default
!
line vty 0 4
 exec-timeout 10 0
 login authentication default
 transport input ssh
 access-class MGMT-HOSTS in
!
ntp authenticate
ntp authentication-key 1 md5 PLACEHOLDERKEY
ntp trusted-key 1
ntp server 10.10.0.250 key 1
!
end
