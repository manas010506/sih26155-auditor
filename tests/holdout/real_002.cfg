!
version 12.4
!
hostname CHI-DIST-SW03
!
enable password cisco123
!
no aaa new-model
!
ip subnet-zero
ip http server
ip http authentication local
!
username admin password 0 admin
username backup password 0 backup123
!
interface Loopback0
 ip address 10.90.0.3 255.255.255.255
!
interface GigabitEthernet0/0
 description UPLINK-TO-CORE
 ip address 10.90.10.3 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description ACCESS-VLAN-50
 ip address 192.168.50.1 255.255.255.0
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 description ACCESS-VLAN-60
 ip address 192.168.60.1 255.255.255.0
 duplex auto
 speed auto
!
router eigrp 100
 network 10.90.0.0 0.0.255.255
 network 192.168.50.0 0.0.0.255
 network 192.168.60.0 0.0.0.255
 no auto-summary
!
ip classless
ip route 0.0.0.0 0.0.0.0 10.90.10.1
!
snmp-server community public RO
!
line con 0
 password cisco
 login
line vty 0 4
 password cisco
 login
 transport input telnet
line vty 5 15
 password cisco
 login
 transport input telnet
!
end