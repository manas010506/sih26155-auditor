! Source: Provided by User (Hardened CISCO IOS XE Baseline)
! Retrieved 2026-09-03, hostnames and addresses anonymised
!
! HARDENED CISCO IOS XE CONFIG
! Assembled from the literal "Remediation" command syntax in each
! recommendation of: CIS Cisco IOS XE 17.x Benchmark v2.2.1 (07-17-2025)
!
version 17.6
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authentication enable default group tacacs+ enable
aaa accounting commands 15 default start-stop group tacacs+
aaa accounting connection default start-stop group tacacs+
aaa accounting exec default start-stop group tacacs+
aaa accounting network default start-stop group tacacs+
aaa accounting system default start-stop group tacacs+
!
hostname CIS-HARDENED-RTR
ip domain-name corp.example.com
!
enable secret 9 $9$REPLACE_WITH_SCRYPT_HASH
service password-encryption
username localadmin privilege 15 secret 9 $9$REPLACE_WITH_SCRYPT_HASH
username readonlyuser privilege 1 secret 9 $9$REPLACE_WITH_SCRYPT_HASH
!
banner motd ^
UNAUTHORIZED ACCESS TO THIS DEVICE IS PROHIBITED.
You must have explicit, authorized permission to access this device.
All activity is logged and monitored.
^
banner login ^
Authorized users only. All connections are recorded.
^
banner exec ^
Reminder: this is a production device. Follow change-control procedure.
^
!
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
access-list 10 permit 10.1.1.0 0.0.0.255
access-list 10 deny   any log
!
line aux 0
 no exec
 exec-timeout 10 0
!
line con 0
 exec-timeout 10 0
 login authentication default
!
line vty 0 15
 login authentication default
 transport input ssh
 access-class 10 in
 exec-timeout 10 0
!
ip http secure-server
ip http authentication default
ip http max-connections 2
ip http timeout-policy idle 600 life 1800 requests 1
no ip http server
!
no snmp-server community public
no snmp-server community private
access-list 20 permit 10.1.1.0 0.0.0.255
access-list 20 deny   any log
snmp-server community REPLACE_WITH_STRONG_STRING ro 20
snmp-server group MONITOR-GRP v3 priv
snmp-server user snmpadmin MONITOR-GRP v3 auth sha AUTH_PASSPHRASE priv aes 128 PRIV_PASSPHRASE
snmp-server host 10.1.1.50 version 3 priv snmpadmin
snmp-server enable traps snmp authentication linkup linkdown coldstart warmstart
!
no cdp run
ip dhcp bootp ignore
no service dhcp
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
!
archive
 log config
  logging enable
!
logging buffered 65536 informational
logging console critical
logging host 10.1.1.60
logging trap informational
service timestamps debug datetime msec show-timezone
service timestamps log datetime msec show-timezone
logging source-interface Loopback0
login on-failure log
login on-success log
!
ntp authenticate
ntp authentication-key 1 md5 REPLACE_WITH_NTP_KEY
ntp trusted-key 1
ntp server 10.1.1.10 key 1
!
interface Loopback0
 ip address 10.10.10.10 255.255.255.255
!
ntp source Loopback0
ip tftp source-interface Loopback0
!
no ip source-route
!
interface GigabitEthernet0/0
 description WAN-UPLINK
 ip address 203.0.113.2 255.255.255.252
 no ip proxy-arp
 ip verify unicast source reachable-via rx allow-default
 ip access-group WAN-IN in
!
ip access-list extended WAN-IN
 deny ip 127.0.0.0 0.255.255.255 any log
 deny ip 10.0.0.0 0.255.255.255 any log
 deny ip 0.0.0.0 0.255.255.255 any log
 deny ip 172.16.0.0 0.15.255.255 any log
 deny ip 192.168.0.0 0.0.255.255 any log
 deny ip 192.0.2.0 0.0.0.255 any log
 deny ip 169.254.0.0 0.0.255.255 any log
 deny ip 224.0.0.0 31.255.255.255 any log
 deny ip host 255.255.255.255 any log
 permit tcp any host 203.0.113.2 eq 22
 permit tcp any host 203.0.113.2 eq 443
 deny ip any any log
!
end
