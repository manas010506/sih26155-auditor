!
version 12.4
!
hostname ATL-LEGACY-SW04
!
no service password-encryption
!
enable password atl2010
!
username svcacct password 0 svcpass
username tech password 0 tech123
!
ip subnet-zero
!
interface Loopback0
 ip address 10.93.0.4 255.255.255.255
!
interface GigabitEthernet0/0
 description UPLINK
 ip address 10.93.10.4 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description ACCESS-VLAN-70
 ip address 192.168.70.1 255.255.255.0
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 description ACCESS-VLAN-80
 ip address 192.168.80.1 255.255.255.0
 duplex auto
 speed auto
!
router rip
 version 2
 network 10.0.0.0
 network 192.168.70.0
 network 192.168.80.0
 no auto-summary
!
ip classless
ip route 0.0.0.0 0.0.0.0 10.93.10.1
!
snmp-server community atlro RO
!
line con 0
 password console1
 login
line vty 0 4
 password telnet1
 login
 transport input telnet
line vty 5 15
 password telnet1
 login
 transport input telnet
!
end