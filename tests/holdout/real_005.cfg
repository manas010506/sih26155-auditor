!
version 15.4
!
hostname NY-CORE-SW01
!
enable secret 9 $9$NyCoreSecret1$998877665544332211aabbccdd
!
username nyadmin privilege 15 secret 9 $9$NyCoreUser1$5566778899zzyyxxwwvvuuttss
